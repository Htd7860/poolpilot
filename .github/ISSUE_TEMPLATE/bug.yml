name: Bug report / 问题反馈
description: Report a reproducible problem / 提交可复现的问题
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: PoolPilot version, JDK, Spring Boot, OS and browser. Do not include tokens.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
      description: Minimal configuration and exact steps; remove credentials and business data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Include relevant output with sensitive values removed.
